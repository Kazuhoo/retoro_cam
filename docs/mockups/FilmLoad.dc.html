<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>カメラを選ぶ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&amp;family=Zen+Kurenaido&amp;family=VT323&amp;family=Shrikhand&amp;family=Special+Elite&amp;family=Pacifico&amp;family=DM+Serif+Display:ital@0;1&amp;family=Monoton&amp;display=swap">
<style>
body{margin:0}
a{color:#1C1B19}a:hover{color:#1C1B19}
@keyframes popin{0%{transform:scale(0.6) translateY(30px);opacity:0}70%{transform:scale(1.06) translateY(-4px);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes fadeup{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes hint{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
@keyframes hintup{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes drop{0%{transform:translateY(-60px);opacity:0}60%{transform:translateY(6px);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.25}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
@keyframes press{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes turn{0%,18%{transform:rotate(0deg)}52%,82%{transform:rotate(-90deg)}100%{transform:rotate(0deg)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 34px; background: #1C1B19; font-family: 'Zen Kaku Gothic New', sans-serif; color: #F2EDE4; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden;">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">{{title}}</h1>
<sc-if value="{{midRoll}}" hint-placeholder-val="{{ false }}"><a href="Home.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 22px; background: #2B2925; color: #F2EDE4; font-size: 13px; text-decoration: none;">戻る</a></sc-if>
</div>
<div style="font-size: 12px; color: #A39E93; margin-top: -6px">どのカメラも24枚撮り ・ カードを押すと作例が見られます</div>
<div tabindex="0" aria-label="カメラの一覧。左右にドラッグか矢印キーで選ぶ" onPointerDown="{{stageDown}}" onPointerMove="{{stageMove}}" onPointerUp="{{stageUp}}" onPointerCancel="{{stageCancel}}" onPointerLeave="{{stageLeave}}" onKeyDown="{{stageKey}}" style="flex: 1; min-height: 0; position: relative; perspective: 1100px; touch-action: none; cursor: grab; outline: none">
<sc-for list="{{cards}}" as="cd" hint-placeholder-count="5">
<div data-idx="{{cd.idx}}" style="position: absolute; left: 50%; top: 50%; width: 226px; height: 300px; margin-left: -113px; margin-top: -150px; transform-style: preserve-3d; transform: {{cd.tf}}; z-index: {{cd.z}}; opacity: {{cd.op}}">
<div style="position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY({{cd.flip}}); transition: transform 0.6s cubic-bezier(.2,.8,.2,1)">

<div style="position: absolute; inset: 0; backface-visibility: hidden; border-radius: 10px; box-sizing: border-box; padding: 12px 14px; background: linear-gradient(180deg, #F7F1E5 0%, #EDE5D4 100%); box-shadow: 0 0 0 1px #CFC6B4, 0 {{cd.sh}}px {{cd.shb}}px rgba(0,0,0,0.5); color: #2A2622; display: flex; flex-direction: column; gap: 4px; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="font-family: 'VT323', monospace; font-size: 14px; color: #8A8072">No.{{cd.no}}</div>
<sc-if value="{{cd.free}}" hint-placeholder-val="{{ false }}"><div style="padding: 1px 8px; border-radius: 9px; background: #F08A24; color: #1C1B19; font-size: 10px; font-weight: 700">無料</div></sc-if>
<sc-if value="{{cd.owned}}" hint-placeholder-val="{{ false }}"><div style="padding: 1px 8px; border-radius: 9px; background: #2E4A33; color: #CDEBD1; font-size: 10px; font-weight: 700">購入済み</div></sc-if>
<sc-if value="{{cd.locked}}" hint-placeholder-val="{{ true }}"><div style="padding: 1px 8px; border-radius: 9px; background: #2A2622; color: #F2EDE4; font-size: 10px; font-weight: 700">{{cd.price}}</div></sc-if>
</div>
<div style="display: flex; justify-content: center; padding: 14px 0 10px">
<div aria-hidden="true" style="width: 184px; height: 102px; position: relative; flex-shrink: 0;">
<div style="position: absolute; left: 0; top: 0; width: 220px; height: 122px; transform: scale(0.8364); transform-origin: top left">
<div style="position: absolute; left: 16px; right: 16px; bottom: -12px; height: 16px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 70%)"></div>
<div style="position: absolute; inset: 0; border-radius: 14px; background: linear-gradient(180deg, #3C3C3C 0%, #1E1E1E 16%, #131313 78%, #0A0A0A 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), inset 0 -2px 3px rgba(0,0,0,0.6), 0 6px 14px rgba(0,0,0,0.45)"></div>
<div style="position: absolute; left: 6px; top: 12px; bottom: 12px; width: 26px; border-radius: 8px; background: repeating-linear-gradient(90deg, #242424 0px, #242424 2px, #0B0B0B 2px, #0B0B0B 4px); box-shadow: inset 0 0 6px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.08)"></div>
<div style="position: absolute; left: 38px; right: 54px; top: 6px; bottom: 6px; border-radius: 4px; overflow: hidden; background: linear-gradient(180deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.06) 26%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.2) 100%), {{cd.body}}; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.25)">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 24px; display: flex; flex-direction: column"><sc-for list="{{cd.stripes}}" as="s" hint-placeholder-count="2"><div style="height: 4px; background: {{s.c}}"></div></sc-for><div style="flex: 1; background: {{cd.band}}"></div></div>
<div style="position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.035) 2px, rgba(0,0,0,0.035) 3px)"></div>
</div>
<div style="position: absolute; left: 70px; top: 16px; width: 66px; height: 66px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #262626 0%, #262626 52%, #060606 54%, #060606 62%, #2C2C2C 64%, #151515 100%); box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.3), inset 0 -2px 3px rgba(0,0,0,0.7)"></div>
<div style="position: absolute; left: 87px; top: 33px; width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #6D8199 0%, #26313E 32%, #070A0E 70%, #000000 100%); box-shadow: inset 0 0 4px rgba(0,0,0,0.9)"></div>
<div style="position: absolute; left: 93px; top: 38px; width: 9px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.75); filter: blur(1px); transform: rotate(-30deg)"></div>
<div style="position: absolute; right: 64px; top: 12px; width: 24px; height: 17px; border-radius: 3px; background: linear-gradient(135deg, #3A4856 0%, #10161C 55%, #05080B 100%); box-shadow: 0 0 0 2px #0A0A0A, inset 0 1px 0 rgba(255,255,255,0.25)"></div>
<div style="position: absolute; right: 10px; top: 12px; width: 36px; height: 26px; border-radius: 3px; background: repeating-linear-gradient(0deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0) 2px, rgba(120,120,110,0.35) 2px, rgba(120,120,110,0.35) 3px), linear-gradient(180deg, #F6F6F2 0%, #CFCFC6 100%); box-shadow: 0 0 0 2px #1E1E1E, inset 0 0 4px rgba(0,0,0,0.25)"></div>
</div>
</div>
</div>
<div style="font-family: {{cd.font}}; font-size: 24px; line-height: 1.25; white-space: nowrap">{{cd.name}}</div>
<div style="font-family: 'VT323', monospace; font-size: 16px; color: #6A6258">ISO {{cd.iso}} ・ 24EXP</div>
<div style="font-size: 12px; line-height: 1.6; color: #5A5248">{{cd.desc}}</div>
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at {{cd.gx}} {{cd.gy}}, rgba(255,255,255,{{cd.ga}}) 0%, rgba(255,255,255,0) 55%)"></div>
</div>

<div style="position: absolute; inset: 0; backface-visibility: hidden; transform: rotateY(180deg); border-radius: 10px; overflow: hidden; background: radial-gradient(ellipse 80% 70% at 50% 45%, {{cd.sc}} 0%, {{cd.sd}} 100%); box-shadow: 0 0 0 1px #3A3832, 0 14px 26px rgba(0,0,0,0.55)">
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: rgba(237,230,216,0.85)">作例の写真</div>
<div style="position: absolute; left: 10px; top: 9px; padding: 1px 7px; border-radius: 8px; background: rgba(20,18,16,0.55); font-size: 10px; color: #F2EDE4">作例</div>
<div style="position: absolute; left: 10px; bottom: 8px; font-family: {{cd.font}}; font-size: 17px; line-height: 1.2; color: rgba(255,255,255,0.92); text-shadow: 0 1px 2px rgba(0,0,0,0.6); white-space: nowrap">{{cd.name}}</div>
<div style="position: absolute; right: 10px; bottom: 6px; font-family: 'VT323', monospace; font-size: 16px; color: #FF9A2E; text-shadow: 0 0 5px rgba(255,140,30,0.5)">'26 11 08</div>
</div>

</div>
</div>
</sc-for>
</div>
<div style="display: flex; align-items: center; justify-content: center; gap: 12px">
<button aria-label="前のカメラ" onClick="{{prev}}" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #2B2925; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 L5 8 L10 13" fill="none" stroke="#F2EDE4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<div style="display: flex; gap: 5px" aria-hidden="true"><sc-for list="{{dots}}" as="d" hint-placeholder-count="5"><div style="width: {{d.w}}; height: 6px; border-radius: 3px; background: {{d.c}}"></div></sc-for></div>
<button aria-label="次のカメラ" onClick="{{next}}" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #2B2925; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 L11 8 L6 13" fill="none" stroke="#F2EDE4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>
<div style="font-size: 12px; color: #B5AFA3; line-height: 1.6; text-align: center">{{note1}}<br>{{note2}}</div>
<sc-if value="{{mainIsOpen}}" hint-placeholder-val="{{ false }}"><a href="Rotate.dc.html" style="display: flex; align-items: center; min-height: 52px; padding: 0 22px; border-radius: 26px; justify-content: center; width: 100%; box-sizing: border-box; background: #F08A24; color: #1C1B19; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap">このカメラを開ける</a></sc-if>
<sc-if value="{{mainNotOpen}}" hint-placeholder-val="{{ true }}"><button onClick="{{mainAct}}" disabled="{{mainDisabled}}" style="min-height: 52px; padding: 0 22px; border-radius: 26px; justify-content: center; width: 100%; box-sizing: border-box; border: none; background: {{mainBg}}; color: {{mainFg}}; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap">{{mainLabel}}</button></sc-if>
<sc-if value="{{showBundle}}" hint-placeholder-val="{{ true }}"><button style="min-height: 44px; padding: 0 14px; width: 100%; border-radius: 22px; border: 1px solid #5A564D; background: transparent; color: #E2DCD0; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; cursor: pointer; white-space: nowrap">4台セット $2.99</button></sc-if>
<div style="margin: 0 -20px; height: 50px; flex-shrink: 0; box-sizing: border-box; background: #24221F; border-top: 1px dashed #4A473F; border-bottom: 1px dashed #4A473F; display: flex; align-items: center; justify-content: center; gap: 8px; color: #A39E93; font-size: 12px"><span style="padding: 1px 6px; border: 1px solid #8A847A; border-radius: 3px; font-size: 10px">AD</span><span>AdMob アダプティブバナー</span></div>
<sc-if value="{{showDetail}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 500">
<dc-import name="Purchase" camera="{{detailCam}}" mid-roll="{{midRoll}}" on-back="{{closeDetail}}" on-bought="{{markBought}}" hint-size="390px,844px"></dc-import>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"midRoll":{"editor":"boolean","default":false},"owned":{"editor":"enum","options":["none","party","all"],"default":"party"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    const self = this;
    let last = performance.now();
    const step = function (now) {
      const dt = Math.min(0.033, (now - last) / 1000); last = now;
      const s = self.state || {};
      if (!s.dragging) {
        const pos = s.pos || 0, tgt = s.tgt || 0, vel = s.vel || 0;
        const acc = 160 * (tgt - pos) - 22 * vel;
        const nv = vel + acc * dt;
        const np = pos + nv * dt;
        if (Math.abs(tgt - np) < 0.0008 && Math.abs(nv) < 0.002) {
          if (pos !== tgt || vel !== 0) self.setState({ pos: tgt, vel: 0 });
        } else self.setState({ pos: np, vel: nv });
      }
      self._raf = requestAnimationFrame(step);
    };
    this._raf = requestAnimationFrame(step);
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); }
  renderVals() {
    const st = this.state || {};
    const self = this;
    const list = [
      { id: 'sunshine', name: 'SUNDAY 400', font: 'Shrikhand, cursive', iso: 400, grain: 'ほどほど', look: 'あたたかい暖色', era: '90年代', desc: '日曜日のあたたかい色。90年代の写真屋プリント', free: true,
        body: '#F2B42A', band: '#24315E', stripes: ['#F7D24A', '#EE8A2B', '#D9452B'],
        samples: [['#C49A5C', '#3E2E1E'], ['#A38E62', '#33301F'], ['#C0855A', '#3C2A1E']] },
      { id: 'charcoal', name: 'NOIR 1600', font: 'Special Elite, monospace', iso: 1600, grain: 'とても粗い', look: 'モノクロ', era: '70年代', desc: '粒子の粗い、70年代のモノクロ', free: false,
        body: '#2A2825', band: '#1A1917', stripes: ['#F08A24'],
        samples: [['#A0A0A0', '#141414'], ['#7E7E7E', '#101010'], ['#B8B8B8', '#1A1A1A']] },
      { id: 'pool', name: 'SPLASH 200', font: 'Pacifico, cursive', iso: 200, grain: 'こまかい', look: '明るい青み', era: '90年代', desc: '明るく青みがかった、夏の色', free: false,
        body: '#2E5FB4', band: '#9CCBEA', stripes: ['#F4F1E6'],
        samples: [['#C4E0E8', '#5A8496'], ['#B4D8E2', '#4E7A8C'], ['#D2E6E4', '#6A8E96']] },
      { id: 'green', name: 'ALBUM 100', font: 'DM Serif Display, serif', iso: 100, grain: 'とてもこまかい', look: '色あせ、深い緑', era: '80年代', desc: '少し色あせた、家族アルバム', free: false,
        body: '#3F8A45', band: '#161616', stripes: ['#F4F1E6', '#C8352B'],
        samples: [['#A3AE8E', '#454C3A'], ['#B2A88E', '#4C463A'], ['#94A68C', '#3E4A3A']] },
      { id: 'party', name: 'NITE 800', font: 'Monoton, cursive', iso: 800, grain: '粗い', look: '黒がつぶれ、肌が赤い', era: '90年代', desc: 'フラッシュで夜を撮る', free: false,
        body: '#151515', band: '#2A2A2A', stripes: ['#FF4FA3'],
        samples: [['#F0C2B0', '#080808'], ['#E8A8A0', '#050505'], ['#F4D0C0', '#0A0A0A']] }
    ];
    const n = list.length;
    const ownedSet = ({ none: [], party: ['party'], all: ['charcoal', 'pool', 'green', 'party'] }[this.props.owned || 'party'] || []).concat(st.bought || []);
    const pos = st.pos || 0;
    const sel = Math.max(0, Math.min(n - 1, Math.round(pos)));
    const flipped = st.flipped === sel && !st.dragging ? sel : -1;
    const hx = st.hx || 0, hy = st.hy || 0;
    const midRoll = !!this.props.midRoll;
    const goTo = function (i) { self.setState({ tgt: Math.max(0, Math.min(n - 1, i)), flipped: -1 }); };
    const usableOf = function (f) { return f.free || ownedSet.indexOf(f.id) >= 0; };
    const actionFor = function (f) {
      const usable = usableOf(f);
      if (!usable) return { label: '詳しく見る', bg: '#F2EDE4', fg: '#1C1B19', disabled: false, run: function () { self.setState({ detail: f.id }); } };
      if (midRoll) return { label: '撮り切ったら選べます', bg: '#2B2925', fg: '#A39E93', disabled: true, run: function () {} };
      return { open: true, label: 'このカメラを開ける', bg: '#F08A24', fg: '#1C1B19', disabled: false, run: function () {} };
    };
    const cards = list.map(function (f, i) {
      const o = i - pos, ao = Math.abs(o);
      const isFront = ao < 0.5;
      const isFlip = flipped === i;
      let tf = 'translateX(' + (o * 150).toFixed(1) + 'px) translateZ(' + (-ao * 90 + (isFlip ? 70 : 0)).toFixed(1) + 'px) rotateY(' + (-o * 18).toFixed(1) + 'deg) rotateZ(' + (o * 3.5).toFixed(1) + 'deg) scale(' + (1 - Math.min(ao, 3) * 0.05).toFixed(3) + ')';
      if (isFront && !isFlip) tf += ' rotateX(' + (-hy * 9).toFixed(1) + 'deg) rotateY(' + (hx * 12).toFixed(1) + 'deg)';
      const owned = !f.free && ownedSet.indexOf(f.id) >= 0;
      const a = actionFor(f);
      return {
        idx: i, no: '0' + (i + 1), name: f.name, font: f.font, iso: f.iso, grain: f.grain, look: f.look, era: f.era, desc: f.desc,
        free: f.free, owned: owned, locked: !f.free && !owned, price: '$0.99',
        body: f.body, band: f.band, stripes: f.stripes.map(function (c) { return { c: c }; }),
        sc: f.samples[0][0], sd: f.samples[0][1],
        tf: tf, z: String(100 - Math.round(ao * 10)), op: ao > 3.4 ? '0' : '1',
        flip: isFlip ? '180deg' : '0deg',
        sh: isFront ? 18 : 8, shb: isFront ? 30 : 14,
        gx: ((hx + 1) * 50).toFixed(0) + '%', gy: ((hy + 1) * 50).toFixed(0) + '%', ga: isFront ? (0.15 + 0.25 * Math.min(1, Math.abs(hx) + Math.abs(hy))).toFixed(2) : '0',
        isOpen: !!a.open, notOpen: !a.open, actLabel: a.label, actBg: a.bg, actFg: a.fg, actDisabled: a.disabled, act: a.run
      };
    });
    const selF = list[sel];
    const ma = actionFor(selF);
    return {
      cards: cards,
      dots: list.map(function (_, i) { return { w: i === sel ? '18px' : '6px', c: i === sel ? '#F08A24' : '#4A473F' }; }),
      midRoll: midRoll,
      title: midRoll ? 'カメラを見る' : 'カメラを選ぶ',
      note1: midRoll ? '今のカメラを撮り切ったら、次のカメラとして選べます。' : '買ったカメラは何度でも使えます。',
      note2: midRoll ? '買ったカメラは何度でも使えます。' : '24枚撮り切ったら、カメラごと現像に出します。',
      showBundle: ownedSet.length === 0,
      mainIsOpen: !!ma.open, mainNotOpen: !ma.open,
      mainLabel: ma.label, mainBg: ma.bg, mainFg: ma.fg, mainDisabled: ma.disabled, mainAct: ma.run,
      prev: function () { goTo(sel - 1); },
      next: function () { goTo(sel + 1); },
      stop: function (e) { if (e && e.stopPropagation) e.stopPropagation(); },
      stageDown: function (e) {
        const s = self.state || {};
        let el = e.target, idx = null;
        while (el && el !== e.currentTarget) { if (el.getAttribute && el.getAttribute('data-idx') != null) { idx = parseInt(el.getAttribute('data-idx'), 10); break; } el = el.parentNode; }
        self._d = { x: e.clientX, p: s.pos || 0, lx: e.clientX, lt: performance.now(), v: 0, moved: false, idx: idx };
        if (e.currentTarget && e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
      },
      stageMove: function (e) {
        const d = self._d;
        if (d) {
          const dx = e.clientX - d.x;
          if (!d.moved && Math.abs(dx) > 6) { d.moved = true; self.setState({ dragging: true, flipped: -1, hx: 0, hy: 0 }); }
          if (!d.moved) return;
          const now = performance.now();
          const dt = Math.max(1, now - d.lt);
          d.v = (-(e.clientX - d.lx) / 150) / (dt / 1000);
          d.lx = e.clientX; d.lt = now;
          const np = Math.max(-0.45, Math.min(n - 1 + 0.45, d.p - dx / 150));
          self.setState({ pos: np });
          return;
        }
        const r = e.currentTarget.getBoundingClientRect();
        self.setState({ hx: Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / 110)), hy: Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / 150)) });
      },
      stageUp: function (e) {
        const d = self._d; self._d = null;
        if (!d) return;
        const s = self.state || {};
        if (d.moved) {
          const p = s.pos || 0;
          const t = Math.max(0, Math.min(n - 1, Math.round(p + Math.max(-2, Math.min(2, d.v * 0.16)))));
          self.setState({ dragging: false, tgt: t, vel: d.v * 0.5 });
          return;
        }
        const idx = d.idx;
        if (idx == null) return;
        const cur = Math.round(s.pos || 0);
        if (idx === cur) self.setState({ flipped: s.flipped === idx ? -1 : idx });
        else goTo(idx);
      },
      stageCancel: function () { self._d = null; self.setState({ dragging: false, tgt: Math.round((self.state || {}).pos || 0) }); },
      stageLeave: function () { if (!self._d) self.setState({ hx: 0, hy: 0 }); },
      stageKey: function (e) {
        if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(sel - 1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); goTo(sel + 1); }
        else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); self.setState({ flipped: (self.state || {}).flipped === sel ? -1 : sel }); }
      },
      showDetail: !!st.detail, detailCam: st.detail || selF.id,
      closeDetail: function () { self.setState({ detail: null }); },
      markBought: function (id) { const b = ((self.state || {}).bought || []).slice(); if (b.indexOf(id) < 0) b.push(id); self.setState({ bought: b }); }
    };
  }
}
</script>
