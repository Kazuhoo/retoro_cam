<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&amp;family=Zen+Kurenaido&amp;family=VT323&amp;family=Shrikhand&amp;family=Special+Elite&amp;family=Pacifico&amp;family=DM+Serif+Display:ital@0;1&amp;family=Monoton&amp;display=swap">
<style>
body{margin:0}
a{color:#F2EDE4}a:hover{color:#F2EDE4}
@keyframes popin{0%{transform:scale(0.6) translateY(30px);opacity:0}70%{transform:scale(1.06) translateY(-4px);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes fadeup{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes hint{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
@keyframes hintup{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes drop{0%{transform:translateY(-60px);opacity:0}60%{transform:translateY(6px);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.25}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
@keyframes press{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes turn{0%,18%{transform:rotate(0deg)}52%,82%{transform:rotate(-90deg)}100%{transform:rotate(0deg)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 34px; background: radial-gradient(ellipse 120% 55% at 50% 42%, rgba(240,138,36,0.16) 0%, rgba(240,138,36,0.05) 45%, rgba(240,138,36,0) 75%), radial-gradient(ellipse 90% 30% at 50% 0%, rgba(247,210,74,0.10) 0%, rgba(247,210,74,0) 100%), url(data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27160%27%20height%3D%27160%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.9%27%20numOctaves%3D%272%27%20seed%3D%2721%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%201%200%200%200%200%201%200%200%200%200%201%200%200%200%200.1%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%2F%3E%3C%2Fsvg%3E), url(data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27160%27%20height%3D%27160%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.6%27%20numOctaves%3D%273%27%20seed%3D%2722%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200.3%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%2F%3E%3C%2Fsvg%3E), linear-gradient(180deg, #23201C 0%, #1C1B19 40%, #171614 100%); font-family: 'Zen Kaku Gothic New', sans-serif; color: #F2EDE4; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden;">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; pointer-events: none"><div style="height: 5px; background: #F7D24A"></div><div style="height: 5px; background: #EE8A2B"></div><div style="height: 5px; background: #D9452B"></div><div style="height: 1px; background: rgba(0,0,0,0.4)"></div></div>


<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">設定</h1>
<a href="Home.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 22px; background: #2E2B26; box-shadow: inset 0 1px 0 rgba(255,236,210,0.10), 0 0 0 1px rgba(240,138,36,0.18); font-size: 13px; text-decoration: none">戻る</a>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">


<sc-for list="{{toggles}}" as="t" hint-placeholder-count="4">
<button onClick="{{t.flip}}" aria-pressed="{{t.pressed}}" style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-radius: 14px; border: none; background: linear-gradient(180deg, #2C2924 0%, #23211E 100%); box-shadow: inset 0 1px 0 rgba(255,236,210,0.07), 0 0 0 1px rgba(240,138,36,0.10); color: #F2EDE4; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 14px; cursor: pointer">
<span>{{t.label}}</span>
<div aria-hidden="true" style="width: 46px; height: 28px; border-radius: 14px; background: {{t.track}}; padding: 3px; box-sizing: border-box; display: flex; justify-content: {{t.side}}"><div style="width: 22px; height: 22px; border-radius: 11px; background: #F2EDE4"></div></div>
</button>
</sc-for>

<a href="Onboarding.dc.html" style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-radius: 14px; background: linear-gradient(180deg, #2C2924 0%, #23211E 100%); box-shadow: inset 0 1px 0 rgba(255,236,210,0.07), 0 0 0 1px rgba(240,138,36,0.10); text-decoration: none; font-size: 14px">
<span>使い方を見る</span>
<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 L11 8 L6 13" fill="none" stroke="#A39E93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>

<button style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-radius: 14px; border: none; background: linear-gradient(180deg, #2C2924 0%, #23211E 100%); box-shadow: inset 0 1px 0 rgba(255,236,210,0.07), 0 0 0 1px rgba(240,138,36,0.10); color: #F2EDE4; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 14px; cursor: pointer">
<span>購入を復元</span>
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7 M4 4v4h4" fill="none" stroke="#A39E93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>

<button style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-radius: 14px; border: none; background: linear-gradient(180deg, #2C2924 0%, #23211E 100%); box-shadow: inset 0 1px 0 rgba(255,236,210,0.07), 0 0 0 1px rgba(240,138,36,0.10); color: #F2EDE4; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 14px; cursor: pointer">
<span>プライバシーポリシー</span>
<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 L11 8 L6 13" fill="none" stroke="#A39E93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>

<button style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-radius: 14px; border: none; background: linear-gradient(180deg, #2C2924 0%, #23211E 100%); box-shadow: inset 0 1px 0 rgba(255,236,210,0.07), 0 0 0 1px rgba(240,138,36,0.10); color: #F2EDE4; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 14px; cursor: pointer">
<span>利用規約</span>
<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 L11 8 L6 13" fill="none" stroke="#A39E93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>

</div>

<div style="margin-top: auto; text-align: center; font-size: 12px; color: #A39E93">バージョン [x.x.x]</div>


</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const self = this;
    const defs = [
      { id: 'date', label: '日付の焼き込み', def: true },
      { id: 'leak', label: '光漏れ', def: false },
      { id: 'sound', label: '巻き上げ音・効果音', def: true },
      { id: 'haptics', label: '振動（ハプティクス）', def: true }
    ];
    return {
      toggles: defs.map(function (d) {
        const on = st[d.id] == null ? d.def : st[d.id];
        return {
          label: d.label,
          pressed: on ? 'true' : 'false',
          track: on ? '#F08A24' : '#4A473F',
          side: on ? 'flex-end' : 'flex-start',
          flip: function () { const o = {}; o[d.id] = !on; self.setState(o); }
        };
      })
    };
  }
}
</script>
</body>
</html>
