<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#F2EDE4}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; padding: 20px 40px; background: #1C1B19; font-family: 'Zen Kaku Gothic New', sans-serif; color: #F2EDE4; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">設定</h1>
<a href="Main.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 22px; background: #2B2925; font-size: 13px; text-decoration: none">カメラに戻る</a>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 20px">


<sc-for list="{{toggles}}" as="t" hint-placeholder-count="4">
<button onClick="{{t.flip}}" aria-pressed="{{t.pressed}}" style="min-height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-radius: 14px; border: none; background: #23211E; color: #F2EDE4; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 14px; cursor: pointer">
<span>{{t.label}}</span>
<div aria-hidden="true" style="width: 46px; height: 28px; border-radius: 14px; background: {{t.track}}; padding: 3px; box-sizing: border-box; display: flex; justify-content: {{t.side}}"><div style="width: 22px; height: 22px; border-radius: 11px; background: #F2EDE4"></div></div>
</button>
</sc-for>

<a href="Onboarding.dc.html" style="min-height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-radius: 14px; background: #23211E; text-decoration: none; font-size: 14px">
<span>使い方を見る</span>
<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 L11 8 L6 13" fill="none" stroke="#A39E93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>

<button style="min-height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-radius: 14px; border: none; background: #23211E; color: #F2EDE4; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 14px; cursor: pointer">
<span>購入を復元</span>
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7 M4 4v4h4" fill="none" stroke="#A39E93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>

<button style="min-height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-radius: 14px; border: none; background: #23211E; color: #F2EDE4; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 14px; cursor: pointer">
<span>プライバシーポリシー</span>
<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 L11 8 L6 13" fill="none" stroke="#A39E93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>

<button style="min-height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-radius: 14px; border: none; background: #23211E; color: #F2EDE4; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 14px; cursor: pointer">
<span>利用規約</span>
<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 L11 8 L6 13" fill="none" stroke="#A39E93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>

</div>

<div style="margin-top: auto; text-align: center; font-size: 12px; color: #A39E93">バージョン [x.x.x]</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const self = this;
    const defs = [
      { id: 'date', label: '日付の焼き込み', def: true },
      { id: 'leak', label: '光漏れ', def: false },
      { id: 'sound', label: '巻き上げ音・効果音', def: true },
      { id: 'haptics', label: '振動（ハプティクス）', def: true }
    ];
    return {
      toggles: defs.map(function (d) {
        const on = st[d.id] == null ? d.def : st[d.id];
        return {
          label: d.label,
          pressed: on ? 'true' : 'false',
          track: on ? '#F08A24' : '#4A473F',
          side: on ? 'flex-end' : 'flex-start',
          flip: function () { const o = {}; o[d.id] = !on; self.setState(o); }
        };
      })
    };
  }
}
</script>
</body>
</html>
