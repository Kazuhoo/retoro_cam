    const tiltApi = function (key) {
      const get = function () { const t = ((self.state || {}).tilts || {})[key]; return t || { rx: REST_X, ry: REST_Y, on: false }; };
      const put = function (t) { const all = Object.assign({}, (self.state || {}).tilts || {}); all[key] = t; self.setState({ tilts: all }); };
      const cur = get();
      return {
        rx: cur.rx.toFixed(1) + 'deg', ry: cur.ry.toFixed(1) + 'deg',
        tr: cur.on ? 'none' : 'transform 0.8s cubic-bezier(.2,1.5,.4,1)',
        start: function (e) {
          const c = get();
          self._tk = key; self._tx = e.clientX; self._ty = e.clientY; self._bx = c.ry; self._by = c.rx;
          put({ rx: c.rx, ry: c.ry, on: true });
          if (e.currentTarget && e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
          if (e.stopPropagation) e.stopPropagation();
        },
        move: function (e) {
          if (self._tk !== key || self._tx == null) return;
          put({ ry: self._bx + (e.clientX - self._tx) * 0.9, rx: Math.max(-60, Math.min(60, self._by - (e.clientY - self._ty) * 0.6)), on: true });
        },
        end: function () {
          if (self._tk !== key) return;
          self._tk = null; self._tx = null;
          const c = get();
          put({ rx: REST_X, ry: REST_Y + 360 * Math.round((c.ry - REST_Y) / 360), on: false });
        }
      };
    };
    const CAMS = {
      sunshine: { name: 'SUNDAY 400', font: 'Shrikhand, cursive', body: '#F2B42A', band: '#24315E', stripes: ['#F7D24A', '#EE8A2B', '#D9452B'] },
      charcoal: { name: 'NOIR 1600', font: 'Special Elite, monospace', body: '#2A2825', band: '#1A1917', stripes: ['#F08A24'] },
      pool: { name: 'SPLASH 200', font: 'Pacifico, cursive', body: '#2E5FB4', band: '#9CCBEA', stripes: ['#F4F1E6'] },
      green: { name: 'ALBUM 100', font: 'DM Serif Display, serif', body: '#3F8A45', band: '#161616', stripes: ['#F4F1E6', '#C8352B'] },
      party: { name: 'NITE 800', font: 'Monoton, cursive', body: '#151515', band: '#2A2A2A', stripes: ['#FF4FA3'] }
    };
    const ENV = {
      pool: { name: 'SPLASH 200', font: 'Pacifico, cursive', body: '#2E5FB4', flap: '#28529C', band: '#9CCBEA', stripes: ['#F4F1E6'] },
      sunshine: { name: 'SUNDAY 400', font: 'Shrikhand, cursive', body: '#F2B42A', flap: '#E2A11A', band: '#24315E', stripes: ['#F7D24A', '#EE8A2B', '#D9452B'] }
    };
    const wrap = function (o) { return Object.assign({}, o, { stripes: o.stripes.map(function (x) { return { c: x }; }) }); };
    const c = wrap(CAMS[this.props.camera] || CAMS.sunshine);
    const rem = this.props.remaining == null ? 7 : this.props.remaining;
    const n = this.props.newEnvelopes == null ? 1 : this.props.newEnvelopes;
    return {
      c: c, e: wrap(ENV.pool), e2: wrap(ENV.sunshine),
      remainLabel: (rem < 10 ? '0' : '') + rem,
      canShoot: rem > 0, isFull: rem <= 0,
      hasNew: n > 0, noNew: n <= 0, newCount: n, multi: n > 1,
      albumCount: 52,
      ct: tiltApi('home')
    };
  }
}
