      green: { name: 'ALBUM 100', font: 'DM Serif Display, serif', desc: '少し色あせた、80年代の家族アルバム。肌がやわらかく写ります。', body: '#3F8A45', band: '#161616', packText: '#FFFFFF', stripes: ['#F4F1E6', '#C8352B'], s: [['#A3AE8E', '#454C3A'], ['#B2A88E', '#4C463A'], ['#94A68C', '#3E4A3A']] },
      party: { name: 'NITE 800', font: 'Monoton, cursive', desc: 'フラッシュで夜を撮る。被写体が白く光り、背景は暗く沈む、90年代の飲み会の写真。', body: '#151515', band: '#2A2A2A', packText: '#F7E9F1', stripes: ['#FF4FA3'], s: [['#F0C2B0', '#080808'], ['#E8A8A0', '#050505'], ['#F4D0C0', '#0A0A0A']] }
    };
    const c0 = CAMS[this.props.camera] || CAMS.party;
    const c = Object.assign({}, c0, {
      stripes: c0.stripes.map(function (x) { return { c: x }; }),
      s0c: c0.s[0][0], s0d: c0.s[0][1], s1c: c0.s[1][0], s1d: c0.s[1][1], s2c: c0.s[2][0], s2d: c0.s[2][1]
    });
    const stage = st.stage || 'detail';
    const tear = st.tear || 0;
    const FULL = 300;
    const open = function () { self.setState({ stage: 'done' }); };
    return {
      c: c,
      isDetail: stage === 'detail', isPack: stage === 'pack', isDone: stage === 'done',
      tearX: Math.round(tear * 0.15) + 'px',
      tearRot: (-(tear / FULL) * 14).toFixed(1) + 'deg',
      tearW: Math.round(Math.min(tear, FULL) / FULL * 380) + 'px',
      buy: function () { self.setState({ stage: 'pack', tear: 0 }); if (self.props.onBought) self.props.onBought(self.props.camera || 'party'); },
      hasBack: !!this.props.onBack, noBack: !this.props.onBack,
      isMid: !!this.props.midRoll, notMid: !this.props.midRoll,
      back: function () { if (self.props.onBack) self.props.onBack(); },
      openPack: open,
      tearStart: function (e) {
        self._tearing = true; self._tx = e.clientX;
        if (e.currentTarget && e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
      },
      tearMove: function (e) {
        if (!self._tearing) return;
        const dx = e.clientX - self._tx; self._tx = e.clientX;
        if (dx <= 0) return;
        const t = ((self.state || {}).tear || 0) + dx;
        if (t >= FULL) { self._tearing = false; self.setState({ tear: FULL }); setTimeout(open, 250); }
        else self.setState({ tear: t });
      },
      tearEnd: function () { self._tearing = false; }
    };
  }
}
</script>
