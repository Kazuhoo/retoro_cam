<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>撮影画面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&amp;family=VT323&amp;family=Shrikhand&amp;family=Special+Elite&amp;family=Pacifico&amp;family=DM+Serif+Display:ital@0;1&amp;family=Monoton&amp;display=swap">
<style>
body{margin:0}
a{color:#F2EDE4}a:hover{color:#FFFFFF}
@keyframes charge{0%,100%{opacity:1}50%{opacity:0.15}}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; padding: 32px 24px 20px; background: {{th.body}}; font-family: 'Zen Kaku Gothic New', sans-serif; color: {{th.text}}; display: flex; gap: 24px; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 16px; display: flex; flex-direction: column">
<sc-for list="{{th.stripes}}" as="s" hint-placeholder-count="3"><div style="height: 3px; background: {{s.c}}"></div></sc-for>
<div style="flex: 1; background: {{th.band}}"></div>
</div>
<div style="position: absolute; top: 6px; left: 30px; z-index: 2; display: flex; align-items: baseline; gap: 6px; font-family: 'VT323', monospace; font-size: 17px; line-height: 1; letter-spacing: 0.06em; color: {{th.sub}}; white-space: nowrap"><span style="font-family: {{th.font}}; font-size: 16px; line-height: 1.1; letter-spacing: 0">{{th.name}}</span> ・ 24EXP</div>
<div style="position: absolute; top: 9px; right: 150px; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: {{th.sub}}; letter-spacing: 0.04em">
<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1 L9 8 L1 8 Z" fill="{{th.sub}}"></path></svg>
<span>シャッター　音量ボタンを押す</span>
</div>


<div style="width: 507px; height: 338px; flex-shrink: 0; border-radius: 14px; position: relative; overflow: hidden; background: #4A4842; box-shadow: 0 0 0 2px #2E2C27">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<div style="font-size: 14px; color: #E2DED6">素のカメラ映像</div>
<div style="font-size: 12px; color: #D0CBC1">フィルムの色は現像までお楽しみ</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.5) 85%, rgba(0,0,0,0.85) 100%); box-shadow: inset 0 0 30px 10px rgba(0,0,0,0.65)"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(125deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.08) 38%, rgba(255,255,255,0) 46%, rgba(255,255,255,0) 70%, rgba(255,255,255,0.04) 76%, rgba(255,255,255,0) 82%)"></div>
<div aria-hidden="true" style="position: absolute; left: 16px; top: 14px; width: 18px; height: 18px; border-left: 2px solid #E9E3D7; border-top: 2px solid #E9E3D7; opacity: 0.6"></div>
<div aria-hidden="true" style="position: absolute; right: 16px; top: 14px; width: 18px; height: 18px; border-right: 2px solid #E9E3D7; border-top: 2px solid #E9E3D7; opacity: 0.6"></div>
<div aria-hidden="true" style="position: absolute; left: 16px; bottom: 14px; width: 18px; height: 18px; border-left: 2px solid #E9E3D7; border-bottom: 2px solid #E9E3D7; opacity: 0.6"></div>
<div aria-hidden="true" style="position: absolute; right: 16px; bottom: 14px; width: 18px; height: 18px; border-right: 2px solid #E9E3D7; border-bottom: 2px solid #E9E3D7; opacity: 0.6"></div>
<sc-if value="{{flash}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: #FFFFFF"></div>
</sc-if>
</div>

<div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding-top: 14px">

<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px">
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px">
<div aria-label="残り{{remaining}}枚" style="width: 38px; height: 26px; border-radius: 6px; background: #0E0D0C; box-shadow: inset 0 1px 4px rgba(0,0,0,0.8), 0 0 0 1.5px #3A3832; overflow: hidden; position: relative">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; transform: translateY({{rollY}}); font-family: 'VT323', monospace; font-size: 22px; line-height: 26px; color: #F2EDE4; text-align: center">
<div style="height: 26px">{{rollFrom}}</div>
<div style="height: 26px">{{rollTo}}</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; box-shadow: inset 0 6px 6px -4px rgba(0,0,0,0.9), inset 0 -6px 6px -4px rgba(0,0,0,0.9)"></div>
</div>
<button aria-label="フィルムを巻き上げる（右になぞる）" onPointerDown="{{dragStart}}" onPointerMove="{{dragMove}}" onPointerUp="{{dragEnd}}" onPointerCancel="{{dragEnd}}" onKeyDown="{{keyWind}}" style="width: 170px; height: 48px; border: none; padding: 0; border-radius: 12px; cursor: ew-resize; touch-action: none; background-color: #3A3731; background-image: repeating-linear-gradient(90deg, #4E4A41 0px, #4E4A41 3px, #22201C 3px, #22201C 8px); background-position: {{dialPos}} 0; box-shadow: inset 14px 0 12px -6px rgba(0,0,0,0.9), inset -14px 0 12px -6px rgba(0,0,0,0.9), 0 0 0 2px #2E2C27, 0 4px 10px rgba(0,0,0,0.5); transform: translateX({{bounceX}})"></button>
</div>
<div style="width: 200px; display: flex; flex-direction: column; gap: 4px; margin-top: 2px; font-size: 11px; line-height: 1.45; color: {{th.sub}}">
<div style="display: flex; gap: 8px"><span style="font-weight: 700; flex-shrink: 0">巻き上げ</span><span>撮ったら、ダイヤルを右へなぞる</span></div>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 13px">
<sc-if value="{{wound}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 8px"><div style="width: 9px; height: 9px; border-radius: 5px; background: #7BC47F; box-shadow: 0 0 8px #7BC47F"></div><span>撮影できます</span></div>
</sc-if>
<sc-if value="{{needWind}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 8px"><div style="width: 9px; height: 9px; border-radius: 5px; background: {{th.dot}}"></div><span>ダイヤルを右になぞって巻き上げ</span></div>
</sc-if>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<a href="SendLab.dc.html" style="display: flex; align-items: center; min-height: 48px; padding: 0 28px; border-radius: 24px; background: {{th.accent}}; color: {{th.onAccent}}; font-size: 15px; font-weight: 700; text-decoration: none">現像</a>
</sc-if>
</div>

<div style="display: flex; align-items: flex-end; justify-content: flex-end; gap: 12px">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px">
<div style="font-size: 10px; line-height: 1.4; color: {{th.sub}}"><div style="font-weight: 700">フラッシュ</div><div>上げるとON</div><div>1枚ごとに上げ直す</div></div>
<div style="display: flex; align-items: center; gap: 8px">
<button aria-label="フラッシュ（上げるとオン）" aria-pressed="{{flashPressed}}" onPointerDown="{{flashDown}}" onPointerUp="{{flashUp}}" onKeyDown="{{flashKey}}" style="width: 34px; height: 68px; border-radius: 7px; border: none; padding: 3px; background: #0E0D0C; box-shadow: inset 0 1px 4px rgba(0,0,0,0.8), 0 0 0 1.5px #3A3832; cursor: ns-resize; touch-action: none; display: flex; flex-direction: column; justify-content: {{knobSide}}">
<div style="width: 28px; height: 34px; border-radius: 5px; background: #4A463E; box-shadow: 0 1px 2px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 6px 5px; box-sizing: border-box">
<div style="border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6E695E 0%, #3A3731 75%); box-shadow: 0 1px 1px rgba(0,0,0,0.6)"></div>
<div style="border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6E695E 0%, #3A3731 75%); box-shadow: 0 1px 1px rgba(0,0,0,0.6)"></div>
<div style="border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6E695E 0%, #3A3731 75%); box-shadow: 0 1px 1px rgba(0,0,0,0.6)"></div>
<div style="border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6E695E 0%, #3A3731 75%); box-shadow: 0 1px 1px rgba(0,0,0,0.6)"></div>
</div>
</button>
<div style="display: flex; flex-direction: column; align-items: center; gap: 3px">
<div aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: {{lampColor}}; box-shadow: {{lampGlow}}; animation: {{lampAnim}}"></div>
<svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2.5 L5.5 13.5 H11 L10 21.5 L18.5 10 H13 Z" fill="none" stroke="{{th.sub}}" stroke-width="2" stroke-linejoin="round"></path></svg>
</div>
</div>
</div>
<a href="Home.dc.html" aria-label="ホーム" style="width: 44px; height: 44px; border-radius: 22px; background: {{th.button}}; display: flex; align-items: center; justify-content: center; text-decoration: none; position: relative"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 L12 4 L20 11 M6 9.5 V20 H10 V14.5 H14 V20 H18 V9.5" fill="none" stroke="#F2EDE4" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg><sc-if value="{{hasNew}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; right: 6px; top: 6px; width: 9px; height: 9px; border-radius: 5px; background: {{th.dot}}; box-shadow: 0 0 0 2px {{th.button}}"></span></sc-if></a>
<a href="Settings.dc.html" aria-label="設定" style="width: 44px; height: 44px; border-radius: 22px; background: {{th.button}}; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="#F2EDE4" stroke-width="1.6"></circle><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8" fill="none" stroke="#F2EDE4" stroke-width="1.6" stroke-linecap="round"></path></svg></a></div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hasNew":{"editor":"boolean","default":true},"theme":{"editor":"enum","options":["sunshine","charcoal","pool","green","party"],"default":"sunshine"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const THEMES = {
      sunshine: { name: 'SUNDAY 400', font: 'Shrikhand, cursive', body: '#F2B42A', text: '#1F2440', sub: '#3A3320', button: '#24315E', accent: '#24315E', onAccent: '#F7D24A', dot: '#D9452B', band: '#24315E', stripes: ['#F7D24A', '#EE8A2B', '#D9452B'] },
      charcoal: { name: 'NOIR 1600', font: 'Special Elite, monospace', body: '#1C1B19', text: '#F2EDE4', sub: '#A39E93', button: '#2B2925', accent: '#F08A24', onAccent: '#1C1B19', dot: '#F08A24', band: '#2B2925', stripes: ['#F08A24'] },
      pool: { name: 'SPLASH 200', font: 'Pacifico, cursive', body: '#2E5FB4', text: '#FFFFFF', sub: '#DCE8F7', button: '#1F3F80', accent: '#F6D343', onAccent: '#1F2A44', dot: '#F6D343', band: '#9CCBEA', stripes: ['#F4F1E6'] },
      party: { name: 'NITE 800', font: 'Monoton, cursive', body: '#151515', text: '#F7E9F1', sub: '#C9A9BD', button: '#2A2A2A', accent: '#FF4FA3', onAccent: '#151515', dot: '#FF4FA3', band: '#2A2A2A', stripes: ['#FF4FA3'] },
      green: { name: 'ALBUM 100', font: 'DM Serif Display, serif', body: '#3F8A45', text: '#FFFFFF', sub: '#E3EFE3', button: '#161616', accent: '#C8352B', onAccent: '#FFFFFF', dot: '#F4F1E6', band: '#161616', stripes: ['#F4F1E6', '#C8352B'] }
    };
    const th0 = THEMES[this.props.theme] || THEMES.sunshine;
    const th = Object.assign({}, th0, { stripes: th0.stripes.map(function (c) { return { c: c }; }) });
    const remaining = st.remaining == null ? 24 : st.remaining;
    const ready = st.ready == null ? true : st.ready;
    const FULL = 140;
    const wind = st.wind || 0;
    const empty = remaining <= 0;
    const wound = ready && !empty;
    const pad = function (n) { return (n < 10 ? '0' : '') + n; };
    const self = this;
    const setFlash = function (on) {
      const cur = !!((self.state || {}).flashOn);
      if (on === cur) return;
      self.setState({ flashOn: on });
    };
    const bump = function () {
      if (self._bumping) return;
      self._bumping = true;
      self.setState({ bounce: true });
      setTimeout(function () { self._bumping = false; self.setState({ bounce: false }); }, 140);
    };
    const add = function (dx) {
      if (empty || dx <= 0) return;
      const s = self.state || {};
      const rem = s.remaining == null ? 24 : s.remaining;
      const isReady = s.ready == null ? true : s.ready;
      const spin = (s.spin || 0) + dx;
      if (isReady) { bump(); return; }
      const next = (s.wind || 0) + dx;
      if (next >= FULL) {
        self.setState({ wind: 0, spin: spin, remaining: rem - 1, ready: true });
      } else {
        self.setState({ wind: next, spin: spin });
      }
    };
    return {
      th: th,
      hasNew: this.props.hasNew == null ? true : !!this.props.hasNew,
      remaining: remaining,
      rollFrom: pad(remaining),
      rollTo: pad(Math.max(remaining - 1, 0)),
      rollY: (-26 * wind / FULL).toFixed(1) + 'px',
      wound: wound,
      needWind: !ready && !empty,
      empty: empty,
      flash: !!st.flash,
      flashPressed: st.flashOn ? 'true' : 'false',
      knobSide: st.flashOn ? 'flex-start' : 'flex-end',
      lampColor: st.flashOn ? '#FF6A2B' : '#3A3832',
      lampGlow: st.flashOn ? '0 0 8px #FF6A2B' : 'none',
      lampAnim: 'none',
      flashDown: function (e) {
        self._flashY = e.clientY;
        if (e.currentTarget && e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
      },
      flashUp: function (e) {
        if (self._flashY == null) return;
        const dy = e.clientY - self._flashY;
        self._flashY = null;
        const cur = !!((self.state || {}).flashOn);
        setFlash(dy < -6 ? true : dy > 6 ? false : !cur);
      },
      flashKey: function (e) {
        if (e.key === 'ArrowUp') { e.preventDefault(); setFlash(true); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); setFlash(false); }
        else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setFlash(!((self.state || {}).flashOn)); }
      },
      dialPos: Math.round(st.spin || 0) + 'px',
      bounceX: st.bounce ? '4px' : '0px',
      shutterColor: wound ? '#F2EDE4' : '#4A4740',
      dragStart: function (e) {
        if (empty) return;
        self._dragging = true;
        self._lastX = e.clientX;
        if (e.currentTarget && e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
      },
      dragMove: function (e) {
        if (!self._dragging) return;
        const dx = e.clientX - self._lastX;
        self._lastX = e.clientX;
        add(dx);
      },
      dragEnd: function () { self._dragging = false; },
      keyWind: function (e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); add(FULL / 3); }
      },
      shoot: function () {
        if (!wound) return;
        if (remaining <= 1) {
          self.setState({ wind: 0, remaining: 0, ready: false, flash: true, flashOn: false });
        } else {
          self.setState({ wind: 0, ready: false, flash: true, flashOn: false });
        }
        setTimeout(function () { self.setState({ flash: false }); }, 120);
      }
    };
  }
}
</script>
</body>
</html>
