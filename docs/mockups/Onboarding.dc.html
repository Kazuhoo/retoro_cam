<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>オンボーディング</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&amp;family=Zen+Kurenaido&amp;family=VT323&amp;family=Shrikhand&amp;family=Special+Elite&amp;family=Pacifico&amp;family=DM+Serif+Display:ital@0;1&amp;family=Monoton&amp;display=swap">
<style>
body{margin:0}
a{color:#1C1B19}a:hover{color:#1C1B19}
@keyframes popin{0%{transform:scale(0.6) translateY(30px);opacity:0}70%{transform:scale(1.06) translateY(-4px);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes fadeup{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes hint{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
@keyframes hintup{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes drop{0%{transform:translateY(-60px);opacity:0}60%{transform:translateY(6px);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.25}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
@keyframes press{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes turn{0%,18%{transform:rotate(0deg)}52%,82%{transform:rotate(-90deg)}100%{transform:rotate(0deg)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 34px; background: #1C1B19; font-family: 'Zen Kaku Gothic New', sans-serif; color: #F2EDE4; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden;">


<div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
<div style="display: flex; gap: 8px" aria-hidden="true">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
<div style="width: {{d.w}}; height: 8px; border-radius: 4px; background: {{d.c}}"></div>
</sc-for>
</div>
<sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
<button onClick="{{skip}}" style="min-height: 44px; padding: 0 14px; border: none; background: transparent; color: #B5AFA3; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 13px; cursor: pointer">スキップ</button>
</sc-if>
</div>

<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px">

<div style="width: 340px; height: 230px; flex-shrink: 0; border-radius: 18px; background: #23211E; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden">

<sc-if value="{{s0}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 14px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="width: 64px; height: 64px; border-radius: 16px; background: #2E2C27; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z" fill="none" stroke="#F2EDE4" stroke-width="1.5" stroke-linejoin="round"></path><circle cx="12" cy="13" r="3.5" fill="none" stroke="#F2EDE4" stroke-width="1.5"></circle></svg></div>
<div style="font-size: 13px">撮る</div>
</div>
<svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><path d="M1 6 H16 M12 2 L16 6 L12 10" fill="none" stroke="#8A847A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="width: 64px; height: 64px; border-radius: 16px; background: #2E2C27; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="#F2EDE4" stroke-width="1.5"></circle><path d="M12 7v5l3.5 2" fill="none" stroke="#F2EDE4" stroke-width="1.5" stroke-linecap="round"></path></svg></div>
<div style="font-size: 13px">待つ</div>
</div>
<svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><path d="M1 6 H16 M12 2 L16 6 L12 10" fill="none" stroke="#8A847A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="width: 64px; height: 64px; border-radius: 16px; background: #F08A24; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="1.5" fill="none" stroke="#1C1B19" stroke-width="1.6"></rect><path d="M3 10h18" fill="none" stroke="#1C1B19" stroke-width="1.6"></path></svg></div>
<div style="font-size: 13px">受け取る</div>
</div>
</div>
</sc-if>

<sc-if value="{{s1}}" hint-placeholder-val="{{ false }}">
<div style="position: relative; width: 250px; height: 126px">
<div style="position: absolute; inset: 0; border-radius: 22px; border: 3px solid #8A847A; box-sizing: border-box"></div>
<div style="position: absolute; left: 14px; top: 14px; right: 14px; bottom: 14px; border-radius: 10px; background: #2E2C27"></div>
<div style="position: absolute; top: -7px; right: 60px; width: 30px; height: 6px; border-radius: 3px; background: #F08A24; animation: pulse 1.2s ease-in-out infinite"></div>
<div style="position: absolute; top: -7px; right: 100px; width: 30px; height: 6px; border-radius: 3px; background: #F08A24; animation: pulse 1.2s ease-in-out infinite"></div>
<div style="position: absolute; top: -52px; right: 74px; animation: press 1.2s ease-in-out infinite"><svg width="44" height="40" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 2 V18 M6 12 L12 18 L18 12" fill="none" stroke="#F2EDE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
</div>
</sc-if>

<sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 32px; border-radius: 7px; background: #0E0D0C; box-shadow: 0 0 0 1.5px #3A3832; display: flex; align-items: center; justify-content: center; font-family: 'VT323', monospace; font-size: 26px">23</div>
<div style="width: 190px; height: 56px; border-radius: 14px; background-color: #3A3731; background-image: repeating-linear-gradient(90deg, #4E4A41 0px, #4E4A41 3px, #22201C 3px, #22201C 8px); box-shadow: inset 14px 0 12px -6px rgba(0,0,0,0.9), inset -14px 0 12px -6px rgba(0,0,0,0.9), 0 0 0 2px #2E2C27"></div>
</div>
<div style="animation: nudge 1.2s ease-in-out infinite"><svg width="60" height="16" viewBox="0 0 60 16" aria-hidden="true"><path d="M2 8 H56 M49 2 L57 8 L49 14" fill="none" stroke="#F08A24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
</div>
</sc-if>

<sc-if value="{{s3}}" hint-placeholder-val="{{ false }}">
<div style="width: 230px; height: 144px; border-radius: 10px; background: #3A3833; position: relative; overflow: hidden; box-shadow: 0 10px 22px rgba(0,0,0,0.5)">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 42px; background: #2E2C28; border-bottom: 1px solid rgba(0,0,0,0.3)"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column"><div style="height: 6px; background: #F08A24"></div><div style="height: 22px; background: #1C1B19"></div></div>
<div style="position: absolute; right: 14px; bottom: 40px; padding: 5px 9px; background: #F4EEE2; color: #3B3328; font-family: 'VT323', monospace; font-size: 15px; line-height: 1">24 EXP</div>
</div>
</sc-if>

</div>

<div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px">
<div style="font-size: 12px; color: #F08A24; font-weight: 700">{{label}}</div>
<h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.4; white-space: pre-line">{{title}}</h1>
<p style="margin: 0; font-size: 14px; color: #C9C3B8; line-height: 1.7; white-space: pre-line">{{body}}</p>
</div>

</div>

<div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px">
<sc-if value="{{hasBack}}" hint-placeholder-val="{{ false }}">
<button onClick="{{back}}" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: #2B2925; color: #F2EDE4; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 13px; cursor: pointer">戻る</button>
</sc-if>
<sc-if value="{{noBack}}" hint-placeholder-val="{{ true }}"><div></div></sc-if>
<sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
<button onClick="{{next}}" style="min-height: 52px; padding: 0 34px; border-radius: 26px; border: none; background: #F2EDE4; color: #1C1B19; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">次へ</button>
</sc-if>
<sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}">
<a href="FilmLoad.dc.html" style="display: flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 26px; background: #F08A24; font-size: 15px; font-weight: 700; text-decoration: none">最初のカメラを開ける</a>
</sc-if>
</div>


</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const steps = [
      { label: 'ようこそ', title: '撮って、待って、\n受け取るカメラ', body: '撮った写真は、その場では見られません。\n使い捨てカメラのように、現像されるまでのお楽しみです。' },
      { label: 'シャッター', title: '横に持って、\n音量ボタンで撮影', body: '画面にシャッターボタンはありません。\n本体の上にきた音量ボタンを押すと撮れます。' },
      { label: '巻き上げ', title: '1枚撮ったら、\nダイヤルを巻き上げる', body: '右上のダイヤルを右になぞると、残り枚数が回ります。\n数字が回り切ると、次の1枚が撮れます。' },
      { label: '現像', title: '24枚撮り切ったら、\nカメラごと現像に出す', body: '現像には3日かかります。\n写真は封筒に入って届きます。\n1枚ずつ見て、アルバムに残すか決めましょう。' }
    ];
    const n = steps.length;
    const i = Math.max(0, Math.min(n - 1, st.step || 0));
    const self = this;
    const go = function (k) { self.setState({ step: Math.max(0, Math.min(n - 1, k)) }); };
    return {
      label: steps[i].label, title: steps[i].title, body: steps[i].body,
      s0: i === 0, s1: i === 1, s2: i === 2, s3: i === 3,
      dots: steps.map(function (_, k) { return { w: k === i ? '22px' : '8px', c: k === i ? '#F08A24' : '#3A3832' }; }),
      hasBack: i > 0, noBack: i === 0,
      isLast: i === n - 1, notLast: i < n - 1,
      next: function () { go(i + 1); },
      back: function () { go(i - 1); },
      skip: function () { go(n - 1); }
    };
  }
}
</script>
</body>
</html>
